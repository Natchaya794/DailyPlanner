<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Summary - LINE LIFF</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4">

  <!-- 1. Header & User Profile -->
  <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-xl shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center font-bold">
        User
      </div>
      <div>
        <h1 class="text-sm font-semibold text-gray-500">สรุปภาพรวมรายวัน</h1>
        <p class="text-xs text-gray-400">วันนี้ 1 ส.ค. 2026</p>
      </div>
    </div>
  </div>

  <!-- 2. Summary Cards -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl">
      <p class="text-xs text-emerald-600 font-medium">กิจกรรมวันนี้</p>
      <p class="text-lg font-bold text-emerald-700 mt-1">4 / 5 รายการ</p>
    </div>
    <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl">
      <p class="text-xs text-blue-600 font-medium">ค่าใช้จ่ายรวม</p>
      <p class="text-lg font-bold text-blue-700 mt-1">450 ฿</p>
    </div>
  </div>

  <!-- 3. Activity List (Timeline) -->
  <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
    <h2 class="text-sm font-bold text-gray-700 mb-3">รายการกิจกรรมวันนี้</h2>
    
    <div class="space-y-3">
      <!-- Item 1 -->
      <div class="flex items-start border-l-2 border-green-500 pl-3 py-1">
        <div class="flex-1">
          <p class="text-xs font-semibold text-gray-400">08:30 น.</p>
          <p class="text-sm font-medium text-gray-800">ประชุมทีมเช้า</p>
          <span class="inline-block bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded mt-1">งาน</span>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="flex items-start border-l-2 border-blue-500 pl-3 py-1">
        <div class="flex-1">
          <p class="text-xs font-semibold text-gray-400">12:00 น.</p>
          <p class="text-sm font-medium text-gray-800">ทานอาหารกลางวัน</p>
          <span class="inline-block bg-blue-100 text-blue-600 text-[10px] px-2 py-0.5 rounded mt-1">ค่าใช้จ่าย 150฿</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Refresh Button -->
  <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium py-2.5 rounded-xl transition shadow">
    อัปเดตข้อมูลล่าสุด
  </button>

</body>
</html>
