<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINE Planner</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

header{

background:#06C755;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;

}

.card{

background:white;
margin:15px;
padding:15px;
border-radius:15px;
box-shadow:0 3px 8px rgba(0,0,0,.1);

}

button{

width:100%;
padding:13px;
border:none;
background:#06C755;
color:white;
font-size:16px;
border-radius:10px;
margin-top:10px;

}

input,select{

width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ddd;

}

.task{

padding:10px;
border-left:5px solid #06C755;
margin-top:10px;
background:#fafafa;
border-radius:8px;

}

.badge{

background:red;
color:white;
padding:3px 8px;
border-radius:20px;
font-size:12px;

}

</style>

</head>

<body>

<header>

LINE Planner

</header>

<div class="card">

<h3>📅 ปฏิทิน</h3>

<div id="calendar"></div>

</div>

<div class="card">

<h3>➕ เพิ่มกิจกรรม</h3>

<input id="title" placeholder="ชื่องาน">

<input id="date" type="date">

<input id="time" type="time">

<select id="notify">

<option>10 นาที</option>

<option>30 นาที</option>

<option>1 ชั่วโมง</option>

<option>1 วัน</option>

</select>

<button onclick="addTask()">บันทึกกิจกรรม</button>

</div>

<div class="card">

<h3>🔔 การแจ้งเตือน</h3>

<div id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;
let events=[];

document.addEventListener('DOMContentLoaded',function(){

calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{

initialView:'dayGridMonth',

height:500,

locale:'th',

events:events

});

calendar.render();

})

function addTask(){

let title=document.getElementById("title").value;

let date=document.getElementById("date").value;

let time=document.getElementById("time").value;

let notify=document.getElementById("notify").value;

calendar.addEvent({

title:title,

start:date+"T"+time

});

document.getElementById("list").innerHTML+=`

<div class="task">

<b>${title}</b><br>

📅 ${date}<br>

🕒 ${time}<br>

🔔 แจ้งเตือนก่อน ${notify}

</div>

`;

alert("เพิ่มกิจกรรมเรียบร้อย");

}

</script>

</body>

</html>
